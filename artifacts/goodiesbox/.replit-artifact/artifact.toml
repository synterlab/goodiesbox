kind = "web"
previewPath = "/"
title = "GoodiesBox"
version = "1.0.0"
id = "artifacts/goodiesbox"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20147

[services.development]
run = "pnpm --filter @workspace/goodiesbox run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/goodiesbox", "run", "build" ]
serve = "static"
publicDir = "artifacts/goodiesbox/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20147"
BASE_PATH = "/"
