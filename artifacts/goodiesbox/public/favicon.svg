<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D0D14"/>
      <stop offset="100%" stop-color="#13131F"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#FF3CAC"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="0" y1="0" x2="0" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#FF3CAC"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="180" height="180" rx="36" fill="url(#bg)"/>
  <!-- Box body -->
  <rect x="30" y="84" width="120" height="72" rx="8" fill="#1A1A2E" stroke="#00E5FF" stroke-width="2" opacity="0.9"/>
  <!-- Box lid -->
  <rect x="24" y="68" width="132" height="22" rx="6" fill="#1A1A2E" stroke="#00E5FF" stroke-width="2"/>
  <!-- Horizontal ribbon on lid -->
  <rect x="24" y="68" width="132" height="22" rx="6" fill="url(#ribbon)" opacity="0.18"/>
  <rect x="81" y="68" width="18" height="22" fill="url(#ribbon)" opacity="0.7"/>
  <!-- Vertical ribbon on box body -->
  <rect x="81" y="90" width="18" height="66" fill="url(#ribbon2)" opacity="0.55"/>
  <!-- Bow top-left loop -->
  <path d="M90 68 Q72 44 56 50 Q46 56 56 64 Q68 70 90 68Z" fill="url(#ribbon)" opacity="0.9" filter="url(#glow)"/>
  <!-- Bow top-right loop -->
  <path d="M90 68 Q108 44 124 50 Q134 56 124 64 Q112 70 90 68Z" fill="url(#ribbon)" opacity="0.9" filter="url(#glow)"/>
  <!-- Center knot -->
  <circle cx="90" cy="68" r="7" fill="#FF3CAC" filter="url(#glow)"/>
</svg>
