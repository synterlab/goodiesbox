<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0D0D18"/>
      <stop offset="100%" stop-color="#07070F"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="180" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#FF3CAC"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="90" y1="20" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFE600"/>
      <stop offset="50%" stop-color="#FF3CAC"/>
      <stop offset="100%" stop-color="#00E5FF"/>
    </linearGradient>
    <linearGradient id="boxFill" x1="20" y1="88" x2="160" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111124"/>
      <stop offset="100%" stop-color="#0A0A18"/>
    </linearGradient>
    <filter id="glowCyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStar" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowLid" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="180" height="180" rx="36" fill="url(#bg)"/>

  <!-- Box body -->
  <path d="M20 88 L160 88 L160 158 Q160 164 154 164 L26 164 Q20 164 20 158 Z"
        fill="url(#boxFill)" stroke="#00E5FF" stroke-width="3.5"
        filter="url(#glowCyan)"/>

  <!-- Vertical ribbon through center of box -->
  <rect x="78" y="88" width="24" height="76" fill="url(#lid)" opacity="0.28"/>

  <!-- Torn lid — left wing -->
  <path d="M20 66 L87 88 L20 88 Z" fill="url(#lid)" opacity="0.95" filter="url(#glowLid)"/>

  <!-- Torn lid — right wing -->
  <path d="M160 66 L93 88 L160 88 Z" fill="url(#lid)" opacity="0.95" filter="url(#glowLid)"/>

  <!-- Lid top edge -->
  <line x1="20" y1="66" x2="160" y2="66" stroke="url(#lid)" stroke-width="3" opacity="0.55"/>

  <!-- 4-pointed star burst from the tear center -->
  <!-- Outer star points -->
  <path d="M90 16
           L96.5 40
           L122 42
           L102 58
           L110 82
           L90 68
           L70 82
           L78 58
           L58 42
           L83.5 40 Z"
        fill="url(#starGrad)" filter="url(#glowStar)"/>

  <!-- Inner diamond — golden knot -->
  <path d="M90 42 L97 57 L90 72 L83 57 Z" fill="#FFE600" opacity="0.95"/>

  <!-- Small sparkle dots scattered (loot excitement) -->
  <circle cx="36" cy="50" r="3" fill="#00E5FF" opacity="0.7"/>
  <circle cx="144" cy="46" r="3.5" fill="#FF3CAC" opacity="0.7"/>
  <circle cx="28" cy="78" r="2" fill="#FFE600" opacity="0.6"/>
  <circle cx="152" cy="74" r="2" fill="#00E5FF" opacity="0.6"/>
</svg>
