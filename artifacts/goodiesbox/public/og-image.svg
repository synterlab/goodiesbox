<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07070F"/>
      <stop offset="100%" stop-color="#0D0D1A"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#FF3CAC"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FFA500"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7B2FBE"/>
      <stop offset="100%" stop-color="#4A0E4E"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="0" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#005C8A"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FF3CAC" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FF3CAC" stop-opacity="0"/>
    </radialGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <clipPath id="cardClip1"><rect width="155" height="215" rx="12"/></clipPath>
    <clipPath id="cardClip2"><rect width="155" height="215" rx="12"/></clipPath>
    <clipPath id="cardClip3"><rect width="155" height="215" rx="12"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="200" cy="200" rx="350" ry="300" fill="url(#glow1)"/>
  <ellipse cx="1000" cy="400" rx="400" ry="320" fill="url(#glow2)"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.06"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top line accent -->
  <rect x="0" y="0" width="1200" height="2" fill="url(#logoGrad)" opacity="0.6"/>

  <!-- === LEFT: Logo + copy === -->
  <!-- Gift icon -->
  <g transform="translate(90, 175)">
    <!-- Box body -->
    <rect x="4" y="36" width="52" height="32" rx="4" fill="#1A1A2E" stroke="#00E5FF" stroke-width="1.5"/>
    <!-- Lid -->
    <rect x="0" y="25" width="60" height="13" rx="3" fill="#1A1A2E" stroke="#00E5FF" stroke-width="1.5"/>
    <!-- Ribbon H -->
    <rect x="25" y="25" width="10" height="13" fill="url(#logoGrad)" opacity="0.8"/>
    <!-- Ribbon V -->
    <rect x="25" y="38" width="10" height="30" fill="url(#logoGrad)" opacity="0.6"/>
    <!-- Bow left -->
    <path d="M30 25 Q18 10 10 14 Q4 18 10 22 Q18 26 30 25Z" fill="url(#logoGrad)" opacity="0.95"/>
    <!-- Bow right -->
    <path d="M30 25 Q42 10 50 14 Q56 18 50 22 Q42 26 30 25Z" fill="url(#logoGrad)" opacity="0.95"/>
    <!-- Knot -->
    <circle cx="30" cy="25" r="4" fill="#FF3CAC"/>
  </g>

  <!-- GoodiesBox text -->
  <text x="168" y="228" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="64" fill="url(#logoGrad)" letter-spacing="-2">GoodiesBox</text>

  <!-- Tagline -->
  <text x="91" y="280" font-family="'Inter', 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="22" fill="#ffffff" opacity="0.65">Open mystery packs. Collect prediction cards. Win prizes.</text>

  <!-- Feature pills -->
  <g transform="translate(91, 315)">
    <!-- Pill 1 -->
    <rect width="138" height="34" rx="17" fill="#00E5FF" fill-opacity="0.12" stroke="#00E5FF" stroke-width="1" stroke-opacity="0.4"/>
    <text x="22" y="22" font-family="'Inter', Arial, sans-serif" font-weight="700" font-size="13" fill="#00E5FF" letter-spacing="1">⬡ SOLANA</text>
    <!-- Pill 2 -->
    <rect x="150" width="110" height="34" rx="17" fill="#627EEA" fill-opacity="0.12" stroke="#627EEA" stroke-width="1" stroke-opacity="0.4"/>
    <text x="172" y="22" font-family="'Inter', Arial, sans-serif" font-weight="700" font-size="13" fill="#8BA3FF" letter-spacing="1">⬡ EVM</text>
    <!-- Pill 3 -->
    <rect x="272" width="148" height="34" rx="17" fill="#FF3CAC" fill-opacity="0.12" stroke="#FF3CAC" stroke-width="1" stroke-opacity="0.4"/>
    <text x="294" y="22" font-family="'Inter', Arial, sans-serif" font-weight="700" font-size="13" fill="#FF3CAC" letter-spacing="1">★ TESTNET</text>
  </g>

  <!-- Stats row -->
  <g transform="translate(91, 410)">
    <text x="0" y="0" font-family="'Inter', Arial, sans-serif" font-weight="900" font-size="36" fill="#00E5FF">47.8K</text>
    <text x="0" y="22" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="13" fill="#ffffff" opacity="0.45" letter-spacing="1">PACKS OPENED</text>
    <text x="160" y="0" font-family="'Inter', Arial, sans-serif" font-weight="900" font-size="36" fill="#FF3CAC">143K</text>
    <text x="160" y="22" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="13" fill="#ffffff" opacity="0.45" letter-spacing="1">CARDS MINTED</text>
    <text x="310" y="0" font-family="'Inter', Arial, sans-serif" font-weight="900" font-size="36" fill="#14F195">$180K</text>
    <text x="310" y="22" font-family="'Inter', Arial, sans-serif" font-weight="600" font-size="13" fill="#ffffff" opacity="0.45" letter-spacing="1">PRIZES PAID</text>
  </g>

  <!-- URL -->
  <text x="91" y="580" font-family="'Inter', Arial, sans-serif" font-weight="700" font-size="18" fill="#ffffff" opacity="0.35" letter-spacing="1">goodiesbox.xyz</text>

  <!-- === RIGHT: Floating cards === -->
  <!-- Card 1 - LEGENDARY (rotated slightly left) -->
  <g transform="translate(700, 75) rotate(-8)">
    <g filter="url(#cardShadow)">
      <rect width="155" height="215" rx="12" fill="url(#card1)"/>
      <rect width="155" height="215" rx="12" fill="#000" opacity="0.15"/>
      <rect x="0" y="0" width="155" height="4" rx="2" fill="#FFD700"/>
      <!-- Category badge -->
      <rect x="8" y="10" width="60" height="20" rx="4" fill="#FFD700" fill-opacity="0.2"/>
      <text x="14" y="24" font-family="Arial" font-weight="800" font-size="10" fill="#FFD700">LEGENDARY</text>
      <!-- Icon -->
      <text x="55" y="125" font-family="Arial" font-size="52" fill="#ffffff" opacity="0.9">₿</text>
      <!-- Title -->
      <text x="10" y="165" font-family="Arial" font-weight="900" font-size="14" fill="#ffffff">BTC 200K 2026</text>
      <text x="10" y="182" font-family="Arial" font-size="10" fill="#ffffff" opacity="0.6">CRYPTO</text>
      <!-- Shine overlay -->
      <rect width="155" height="215" rx="12" fill="url(#logoGrad)" opacity="0.06"/>
    </g>
  </g>

  <!-- Card 2 - EPIC center (upright, largest) -->
  <g transform="translate(880, 50)">
    <g filter="url(#cardShadow)">
      <rect width="165" height="230" rx="12" fill="url(#card2)"/>
      <rect width="165" height="230" rx="12" fill="#000" opacity="0.1"/>
      <rect x="0" y="0" width="165" height="4" rx="2" fill="#FF3CAC"/>
      <rect x="8" y="10" width="44" height="20" rx="4" fill="#FF3CAC" fill-opacity="0.2"/>
      <text x="14" y="24" font-family="Arial" font-weight="800" font-size="10" fill="#FF3CAC">EPIC</text>
      <!-- Trophy icon -->
      <text x="55" y="135" font-family="Arial" font-size="56" fill="#ffffff" opacity="0.9">🏆</text>
      <text x="10" y="178" font-family="Arial" font-weight="900" font-size="14" fill="#ffffff">SUPER BOWL LX</text>
      <text x="10" y="196" font-family="Arial" font-size="10" fill="#ffffff" opacity="0.6">SPORTS</text>
      <rect width="165" height="230" rx="12" fill="url(#logoGrad)" opacity="0.07"/>
    </g>
  </g>

  <!-- Card 3 - RARE (rotated slightly right) -->
  <g transform="translate(1065, 95) rotate(7)">
    <g filter="url(#cardShadow)">
      <rect width="150" height="210" rx="12" fill="url(#card3)"/>
      <rect width="150" height="210" rx="12" fill="#000" opacity="0.15"/>
      <rect x="0" y="0" width="150" height="4" rx="2" fill="#00E5FF"/>
      <rect x="8" y="10" width="42" height="20" rx="4" fill="#00E5FF" fill-opacity="0.2"/>
      <text x="14" y="24" font-family="Arial" font-weight="800" font-size="10" fill="#00E5FF">RARE</text>
      <!-- ETH symbol -->
      <text x="52" y="125" font-family="Arial" font-size="52" fill="#ffffff" opacity="0.9">Ξ</text>
      <text x="10" y="160" font-family="Arial" font-weight="900" font-size="14" fill="#ffffff">ETH HITS $10K</text>
      <text x="10" y="178" font-family="Arial" font-size="10" fill="#ffffff" opacity="0.6">CRYPTO</text>
      <rect width="150" height="210" rx="12" fill="url(#logoGrad)" opacity="0.06"/>
    </g>
  </g>

  <!-- Divider line between left and right -->
  <line x1="640" y1="60" x2="640" y2="570" stroke="#ffffff" stroke-width="1" stroke-opacity="0.06"/>
</svg>
